---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-cluster-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Jahrough/platform-infrastructure.git
    targetRevision: main
    path: kubernetes/cluster-config
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
    automated:
      prune: true
      selfHeal: true
