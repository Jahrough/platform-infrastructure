---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://aws.github.io/eks-charts
    chart: aws-load-balancer-controller
    targetRevision: 1.11.0
    helm:
      releaseName: aws-load-balancer-controller
      values: |
        clusterName: __EKS_CLUSTER_NAME__
        region: __AWS_REGION__
        vpcId: __VPC_ID__
        replicaCount: 2
        serviceAccount:
          create: true
          name: aws-load-balancer-controller
          annotations:
            eks.amazonaws.com/role-arn: __LOAD_BALANCER_CONTROLLER_IRSA_ROLE_ARN__
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
    automated:
      prune: true
      selfHeal: true
