---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: product-cdc
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: >-
      connect=ghcr.io/jahrough/platform-infrastructure/kafka-connect:latest
    argocd-image-updater.argoproj.io/connect.update-strategy: digest
    argocd-image-updater.argoproj.io/write-back-method: git
spec:
  project: default
  source:
    repoURL: https://github.com/Jahrough/platform-infrastructure.git
    targetRevision: main
    path: kubernetes/overlays/prod/cdc
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-production
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
