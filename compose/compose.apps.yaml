---
services:
  product-catalog:
    build:
      context: ../../product-catalog
      dockerfile: Dockerfile
    container_name: product-catalog
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=product_catalog
      - DB_USER=postgres
      - DB_PASSWORD=${POSTGRES_PASSWORD:?required}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - platform-network

  product-search:
    build:
      context: ../../product-search
      dockerfile: Dockerfile
    container_name: product-search
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - OPENSEARCH_URIS=http://elasticsearch:9200
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/product_search
      - SPRING_DATASOURCE_USERNAME=${SEARCH_DATABASE_USER:?required}
      - SPRING_DATASOURCE_PASSWORD=${SEARCH_DATABASE_PASSWORD:?required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - platform-network

networks:
  platform-network:
    name: platform-network
