---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-cache-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: platform-cache-auth
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: product-catalog-cluster/redis/auth
