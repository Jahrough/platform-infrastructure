---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-catalog-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: platform-db
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: product-catalog-cluster/platform/app-db
        property: username
    - secretKey: password
      remoteRef:
        key: product-catalog-cluster/platform/app-db
        property: password
