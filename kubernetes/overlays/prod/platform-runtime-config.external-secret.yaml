---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-runtime-config
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: platform-runtime-config
    creationPolicy: Owner
  data:
    - secretKey: DB_HOST
      remoteRef:
        key: product-catalog-cluster/platform/runtime-config
        property: DB_HOST
    - secretKey: DB_PORT
      remoteRef:
        key: product-catalog-cluster/platform/runtime-config
        property: DB_PORT
    - secretKey: DB_NAME
      remoteRef:
        key: product-catalog-cluster/platform/runtime-config
        property: DB_NAME
    - secretKey: REDIS_HOST
      remoteRef:
        key: product-catalog-cluster/platform/runtime-config
        property: REDIS_HOST
    - secretKey: REDIS_PORT
      remoteRef:
        key: product-catalog-cluster/platform/runtime-config
        property: REDIS_PORT
    - secretKey: KAFKA_BOOTSTRAP_SERVERS
      remoteRef:
        key: product-catalog-cluster/platform/runtime-config
        property: KAFKA_BOOTSTRAP_SERVERS
    - secretKey: OPENSEARCH_URIS
      remoteRef:
        key: product-catalog-cluster/platform/runtime-config
        property: OPENSEARCH_URIS
