---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-connect
  labels:
    app.kubernetes.io/name: kafka-connect
    app.kubernetes.io/part-of: product-catalog-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kafka-connect
  template:
    metadata:
      labels:
        app: kafka-connect
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kafka-connect
          image: ghcr.io/jahrough/platform-infrastructure/kafka-connect:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: rest
              containerPort: 8083
          env:
            - name: CONNECT_BOOTSTRAP_SERVERS
              valueFrom:
                secretKeyRef:
                  name: platform-runtime-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: CONNECT_SECURITY_PROTOCOL
              value: SSL
            - name: CONNECT_PRODUCER_SECURITY_PROTOCOL
              value: SSL
            - name: CONNECT_CONSUMER_SECURITY_PROTOCOL
              value: SSL
            - name: CONNECT_ADMIN_SECURITY_PROTOCOL
              value: SSL
            - name: CONNECT_REST_PORT
              value: "8083"
            - name: CONNECT_REST_ADVERTISED_HOST_NAME
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: CONNECT_GROUP_ID
              value: product-catalog-connect
            - name: CONNECT_CONFIG_STORAGE_TOPIC
              value: product-catalog-connect-configs
            - name: CONNECT_OFFSET_STORAGE_TOPIC
              value: product-catalog-connect-offsets
            - name: CONNECT_STATUS_STORAGE_TOPIC
              value: product-catalog-connect-status
            - name: CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR
              value: "3"
            - name: CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR
              value: "3"
            - name: CONNECT_STATUS_STORAGE_REPLICATION_FACTOR
              value: "3"
            - name: CONNECT_KEY_CONVERTER
              value: org.apache.kafka.connect.json.JsonConverter
            - name: CONNECT_VALUE_CONVERTER
              value: org.apache.kafka.connect.json.JsonConverter
            - name: CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE
              value: "false"
            - name: CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE
              value: "false"
            - name: CONNECT_PLUGIN_PATH
              value: /usr/share/java,/usr/share/confluent-hub-components
            - name: CONNECT_CONFIG_PROVIDERS
              value: env
            - name: CONNECT_CONFIG_PROVIDERS_ENV_CLASS
              value: org.apache.kafka.common.config.provider.EnvVarConfigProvider
            - name: CDC_DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: platform-runtime-config
                  key: DB_HOST
            - name: CDC_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: platform-cdc-db
                  key: username
            - name: CDC_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-cdc-db
                  key: password
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /
              port: rest
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /connectors
              port: rest
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: rest
            periodSeconds: 20
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-connect
  labels:
    app.kubernetes.io/name: kafka-connect
spec:
  type: ClusterIP
  selector:
    app: kafka-connect
  ports:
    - name: rest
      port: 8083
      targetPort: rest
