---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - platform-runtime-config.external-secret.yaml
  - platform-cache-auth.external-secret.yaml
  - platform-catalog-db.external-secret.yaml
  - platform-search-db.external-secret.yaml
  - product-catalog-hpa.yaml
  - product-search-hpa.yaml
  - product-catalog-pdb.yaml
  - product-search-pdb.yaml

namespace: platform-production

patches:
  - path: patches/product-search-replica-patch.yaml
    target:
      kind: Deployment
      name: product-search
