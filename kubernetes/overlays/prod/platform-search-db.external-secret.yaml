---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-search-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: platform-search-db
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef:
        key: __CLUSTER_NAME__/platform/search-db
        property: url
    - secretKey: username
      remoteRef:
        key: __CLUSTER_NAME__/platform/search-db
        property: username
    - secretKey: password
      remoteRef:
        key: __CLUSTER_NAME__/platform/search-db
        property: password
